<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="color-scheme" content="light dark">
<title>Свежие овощи</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:var(--tg-theme-bg-color,#ffffff);
  --bg2:var(--tg-theme-secondary-bg-color,#f2f4f3);
  --text:var(--tg-theme-text-color,#14201a);
  --hint:var(--tg-theme-hint-color,#7b877f);
  --accent:#2f9e44;
  --accent-soft:rgba(47,158,68,.15);
  --line:rgba(127,140,132,.22);
  --r:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding:0 16px calc(110px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;cursor:pointer}
.hero{padding:20px 0 4px}
.hero h1{margin:0;font-size:27px;letter-spacing:-.4px}
.hero p{margin:4px 0 0;color:var(--hint);font-size:14px}

.chips{
  display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
  position:sticky;top:0;z-index:5;background:var(--bg);
  margin:0 -16px;padding:12px 16px 14px;
}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--bg2);color:var(--text);padding:9px 16px;border-radius:999px;font-size:15px;font-weight:600}
.chip.on{background:var(--accent);color:#fff}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--bg2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;animation:pop .35s ease both}
.pic{aspect-ratio:1/1;border-radius:14px;display:grid;place-items:center;font-size:68px;margin-bottom:10px}
.name{font-weight:700;font-size:16px}
.desc{color:var(--hint);font-size:13px;margin:2px 0 6px;min-height:18px}
.price{font-weight:800;font-size:17px;margin-bottom:10px}
.price small{color:var(--hint);font-weight:500;font-size:12px}
.add{width:100%;height:40px;border:0;border-radius:12px;background:var(--accent);color:#fff;font-weight:700}
.stepper{display:flex;align-items:center;justify-content:space-between;height:40px;background:var(--accent-soft);border-radius:12px}
.stepper button{width:44px;height:40px;border:0;background:transparent;color:var(--accent);font-size:22px;font-weight:700}
.stepper span{font-weight:700;font-size:14px;color:var(--accent)}

.top{display:flex;align-items:center;gap:10px;padding:18px 0 12px}
.top h2{margin:0;font-size:23px}
.back{display:none;border:0;background:var(--bg2);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:22px}
body.web .back{display:block}

.list{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:12px;align-items:center;background:var(--bg2);border-radius:var(--r);padding:10px}
.line .pic{width:56px;height:56px;aspect-ratio:auto;font-size:30px;margin:0;flex:none}
.line .info{flex:1;min-width:0}
.line .info b{display:block}
.line .info span{color:var(--hint);font-size:13px}
.line .stepper{width:108px;flex:none}

.sum-box{background:var(--bg2);border-radius:var(--r);padding:14px 16px;margin-top:14px}
.sum-box div{display:flex;justify-content:space-between;padding:4px 0}
.sum-box .tot{font-weight:800;font-size:18px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
.note{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:10px 14px;font-size:14px;margin-top:12px;font-weight:600}
.note.warn{background:rgba(224,49,49,.12);color:#e03131}

label{display:block;font-size:13px;color:var(--hint);margin:14px 0 6px}
input,textarea{
  width:100%;border:1.5px solid transparent;background:var(--bg2);color:var(--text);
  border-radius:14px;padding:14px;font:inherit;font-size:16px;outline:none;
}
input:focus,textarea:focus{border-color:var(--accent)}
.err{border-color:#e03131!important}
textarea{resize:none;min-height:76px}
.pay{display:flex;gap:10px}
.pay button{flex:1;border:1.5px solid transparent;background:var(--bg2);color:var(--text);border-radius:14px;padding:13px 8px;font-size:14px;font-weight:600;line-height:1.3}
.pay button small{display:block;color:var(--hint);font-weight:500}
.pay button.on{border-color:var(--accent);background:var(--accent-soft)}

.empty{text-align:center;padding:70px 0;color:var(--hint)}
.empty .big{font-size:68px}
.empty .btn{margin-top:14px;border:0;background:var(--accent);color:#fff;border-radius:12px;padding:12px 22px;font-weight:700}

#bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line)}
#bar[hidden]{display:none}
#barbtn{width:100%;height:50px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700;font-size:17px}
#barbtn:disabled{opacity:.5}

@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="bar" hidden><button id="barbtn"></button></div>

<script>
(function(){
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
if(!inTG) document.body.classList.add('web');
if(tg){
  try{ tg.ready(); tg.expand(); }catch(e){}
  try{ tg.setHeaderColor('secondary_bg_color'); }catch(e){}
  try{ tg.disableVerticalSwipes(); }catch(e){}
}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tap = (t) => { try{ tg.HapticFeedback.impactOccurred(t||'light'); }catch(e){} };
const notify = (t) => { try{ tg.HapticFeedback.notificationOccurred(t); }catch(e){} };

let C = null;            // catalog
let cart = {};           // id -> qty (kg)
let view = 'catalog';    // catalog | cart | checkout
let cat = 'all';
let form = {name:'', phone:'', address:'', comment:'', pay:'cash'};
try{ Object.assign(form, JSON.parse(localStorage.getItem('form')||'{}')); form.comment=''; }catch(e){}
const saveForm = () => { try{ localStorage.setItem('form', JSON.stringify(form)); }catch(e){} };

const money = n => new Intl.NumberFormat('ru-RU').format(Math.round(n)) + '\u00A0' + C.shop.currency;
const kg = q => String(q).replace('.', ',') + '\u00A0' + C.shop.unit;
const STEP = () => C.shop.step || 0.5;
const P = id => C.products.find(p => p.id === id);
const sub = () => Object.entries(cart).reduce((s,[id,q]) => s + P(id).price*q, 0);
const delivery = () => { const s = sub(); return s === 0 || s >= C.shop.free_from ? 0 : C.shop.delivery_fee; };
const total = () => sub() + delivery();
const count = () => Object.keys(cart).length;

/* ---------- Нижняя кнопка: нативная MainButton или запасная панель ---------- */
const Main = {
  set(text, visible, active){
    if(inTG){
      tg.MainButton.setParams({text, color:'#2f9e44', text_color:'#ffffff', is_active:active, is_visible:visible});
    }else{
      $('#bar').hidden = !visible;
      $('#barbtn').textContent = text;
      $('#barbtn').disabled = !active;
    }
  }
};

function syncChrome(){
  const s = sub();
  if(view === 'catalog'){
    Main.set('🛒 Корзина · ' + money(s), count() > 0, true);
  }else if(view === 'cart'){
    if(s < C.shop.min_order) Main.set('Минимальный заказ ' + money(C.shop.min_order), count() > 0, false);
    else Main.set('Оформить · ' + money(total()), count() > 0, true);
  }else{
    Main.set('Отправить заказ · ' + money(total()), true, true);
  }
  if(inTG){ view === 'catalog' ? tg.BackButton.hide() : tg.BackButton.show(); }
}

/* ---------- Шаблоны ---------- */
function controlHTML(id){
  const q = cart[id];
  if(!q) return `<button class="add" data-a="inc" data-id="${id}">В корзину</button>`;
  return `<div class="stepper"><button data-a="dec" data-id="${id}">−</button><span>${kg(q)}</span><button data-a="inc" data-id="${id}">+</button></div>`;
}

function gridHTML(){
  const list = C.products.filter(p => cat === 'all' || p.cat === cat);
  return list.map(p => `
    <div class="card">
      <div class="pic" style="background:${esc(p.color||'#eee')}">${p.emoji}</div>
      <div class="name">${esc(p.name)}</div>
      <div class="desc">${esc(p.desc||'')}</div>
      <div class="price">${money(p.price)}<small> / ${C.shop.unit}</small></div>
      ${controlHTML(p.id)}
    </div>`).join('');
}

function catalogHTML(){
  const chips = [{id:'all', title:'🛒 Все'}].concat(C.categories)
    .map(c => `<button class="chip ${c.id===cat?'on':''}" data-a="cat" data-cat="${c.id}">${esc(c.title)}</button>`).join('');
  return `
    <div class="hero"><h1>🥬 ${esc(C.shop.name)}</h1>
      <p>Бесплатная доставка от ${money(C.shop.free_from)}</p></div>
    <div class="chips">${chips}</div>
    <div class="grid" id="grid">${gridHTML()}</div>`;
}

function summaryHTML(){
  const s = sub(), d = delivery();
  return `<div class="sum-box">
    <div><span>Товары</span><span>${money(s)}</span></div>
    <div><span>Доставка</span><span>${d ? money(d) : 'бесплатно'}</span></div>
    <div class="tot"><span>Итого</span><span>${money(s + d)}</span></div>
  </div>`;
}

function cartHTML(){
  const head = `<div class="top"><button class="back" data-a="back">‹</button><h2>Корзина</h2></div>`;
  if(!count()) return head + `<div class="empty"><div class="big">🧺</div><p>Корзина пока пуста</p>
    <button class="btn" data-a="back">Выбрать овощи</button></div>`;
  const s = sub();
  const lines = Object.entries(cart).map(([id,q]) => { const p = P(id); return `
    <div class="line">
      <div class="pic" style="background:${esc(p.color||'#eee')}">${p.emoji}</div>
      <div class="info"><b>${esc(p.name)}</b><span>${money(p.price*q)}</span></div>
      <div class="stepper"><button data-a="dec" data-id="${id}">−</button><span>${kg(q)}</span><button data-a="inc" data-id="${id}">+</button></div>
    </div>`; }).join('');
  let note = '';
  if(s < C.shop.min_order) note = `<div class="note warn">Минимальный заказ — ${money(C.shop.min_order)}. Добавьте ещё на ${money(C.shop.min_order - s)}</div>`;
  else if(s < C.shop.free_from) note = `<div class="note">Ещё ${money(C.shop.free_from - s)} до бесплатной доставки 🚚</div>`;
  return head + `<div class="list">${lines}</div>` + note + summaryHTML();
}

function checkoutHTML(){
  return `
    <div class="top"><button class="back" data-a="back">‹</button><h2>Оформление</h2></div>
    <label>Имя</label>
    <input name="name" autocomplete="name" placeholder="Как к вам обращаться" value="${esc(form.name)}">
    <label>Телефон</label>
    <input name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Номер телефона" value="${esc(form.phone)}">
    <label>Адрес доставки</label>
    <input name="address" autocomplete="street-address" placeholder="Улица, дом, квартира" value="${esc(form.address)}">
    <label>Комментарий</label>
    <textarea name="comment" placeholder="Домофон, удобное время…">${esc(form.comment)}</textarea>
    <label>Оплата</label>
    <div class="pay">
      <button data-a="pay" data-pay="cash" class="${form.pay==='cash'?'on':''}">💵 Наличными<small>при получении</small></button>
      <button data-a="pay" data-pay="transfer" class="${form.pay==='transfer'?'on':''}">📲 Переводом<small>реквизиты пришлём</small></button>
    </div>
    ${summaryHTML()}`;
}

/* ---------- Отрисовка ---------- */
function render(keepScroll){
  const y = window.scrollY;
  const app = $('#app');
  app.innerHTML = view === 'catalog' ? catalogHTML() : view === 'cart' ? cartHTML() : checkoutHTML();
  if(view === 'checkout'){
    app.querySelectorAll('input,textarea').forEach(el => el.addEventListener('input', () => {
      form[el.name] = el.value; el.classList.remove('err'); saveForm();
    }));
  }
  window.scrollTo(0, keepScroll ? y : 0);
  syncChrome();
}
function renderGrid(){ $('#grid').innerHTML = gridHTML(); syncChrome(); }

function go(v){ view = v; render(); }
function back(){ go(view === 'checkout' ? 'cart' : 'catalog'); }

function change(id, dir){
  let q = Math.round(((cart[id]||0) + dir*STEP()) * 100) / 100;
  if(q > 30) q = 30;
  if(q <= 0) delete cart[id]; else cart[id] = q;
  tap('light');
  if(view === 'catalog') renderGrid();
  else if(!count()) render(); else render(true);
}

/* ---------- Отправка заказа ---------- */
function validate(){
  const bad = [];
  if(form.name.trim().length < 2) bad.push('name');
  if(form.phone.replace(/\D/g,'').length < 10) bad.push('phone');
  if(form.address.trim().length < 5) bad.push('address');
  return bad;
}

function submit(){
  const bad = validate();
  if(bad.length){
    notify('error');
    bad.forEach(n => { const el = document.querySelector(`[name="${n}"]`); if(el) el.classList.add('err'); });
    const first = document.querySelector(`[name="${bad[0]}"]`);
    if(first){ first.scrollIntoView({block:'center', behavior:'smooth'}); first.focus(); }
    return;
  }
  const payload = {
    items: Object.entries(cart).map(([id, qty]) => ({id, qty})),
    name: form.name.trim(), phone: form.phone.trim(), address: form.address.trim(),
    comment: form.comment.trim(), pay: form.pay
  };
  notify('success');
  if(inTG) tg.sendData(JSON.stringify(payload));     // бот получит заказ, Mini App закроется
  else alert('Предпросмотр вне Telegram. Бот получит:\n\n' + JSON.stringify(payload, null, 2));
}

function onMain(){
  if(view === 'catalog') go('cart');
  else if(view === 'cart'){ if(sub() >= C.shop.min_order) go('checkout'); }
  else submit();
}

/* ---------- События ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(!el) return;
  const a = el.dataset.a;
  if(a === 'inc') change(el.dataset.id, 1);
  else if(a === 'dec') change(el.dataset.id, -1);
  else if(a === 'cat'){ cat = el.dataset.cat; tap('light'); render(); }
  else if(a === 'back') back();
  else if(a === 'pay'){ form.pay = el.dataset.pay; saveForm(); tap('light');
    document.querySelectorAll('.pay button').forEach(b => b.classList.toggle('on', b.dataset.pay === form.pay)); }
});
if(inTG){
  tg.MainButton.onClick(onMain);
  tg.BackButton.onClick(back);
}else{
  $('#barbtn').addEventListener('click', onMain);
}

/* ---------- Старт ---------- */
fetch('catalog.json?v=' + Date.now())
  .then(r => r.json())
  .then(j => { C = j; document.title = C.shop.name; render(); })
  .catch(() => { $('#app').innerHTML = '<div class="empty"><div class="big">😕</div><p>Не удалось загрузить каталог</p></div>'; });
})();
</script>
</body>
</html>
